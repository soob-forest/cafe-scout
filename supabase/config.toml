project_id = "cafe-scout"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "3MiB"

[storage.buckets.cafe-photos]
public = false
file_size_limit = "3MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://localhost:3001/**"]
enable_signup = false
minimum_password_length = 10

[auth.email]
# Email/password login stays enabled; the global auth.enable_signup=false blocks public registration.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
